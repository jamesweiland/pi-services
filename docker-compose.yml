x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  unbound:
    <<: *restart-policy
    image: mvance/unbound-rpi
    container_name: unbound
    volumes:
      - /dev/urandom:/opt/unbound/etc/unbound/dev/urandom
      - /dev/random:/opt/unbound/etc/unbound/dev/random
      - ./unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf
    networks:
      wg:
        ipv4_address: 10.8.1.4
  pihole:
    <<: *restart-policy
    image: pihole/pihole
    container_name: pihole
    ports:
      # dns ports
      - "53:53/tcp"
      - "53:53/udp"
      # use secondary http/https port since nginx (running on host) gets 80 and 443
      - "8080:80/tcp"
      - "8443:443/tcp"
    environment:
      TZ: "America/New_York"
      FTLCONF_webserver_api_password: "${PIHOLE_ADMIN_PASSWORD}"
      FTLCONF_dns_listeningMode: "ALL"
      # FTLCONF_dns_interface: "eth0"
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_add:
      - SYS_NICE
      - SYS_TIME
    networks:
      wg:
        ipv4_address: 10.8.1.3
  webtunnel-bridge:
    <<: *restart-policy
    # image: "thetorproject/webtunnel-bridge:latest"
    image: "containers.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel:nightly_arm64"
    container_name: webtunnel-bridge
    user: debian-tor
    environment:
      - NICKNAME=$BRIDGE_NICKNAME
      - PT_PORT=15000
      - OR_PORT=$GENEDORPORT
      - EMAIL=$OPERATOR_EMAIL
      - WEBTUNNEL_URL=$URL
    # mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - 'webtunnel-tor-state:/var/lib/tor'
    ports:
      - '127.0.0.1:15000:15000'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  wg-easy:
    <<: *restart-policy
    environment:
      - INSECURE=true
    image: wg-easy-fixed
    container_name: wg-easy
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      wg:
        ipv4_address: 10.8.1.2
  notify-slack:
    <<: *restart-policy
    build: ./notify-slack
    volumes:
      - ./notify-slack/scripts:/scripts
      - ./notify-slack/crontab:/etc/crontabs/root
      - ./notify-slack/.env:/.env:ro
    restart: unless-stopped
    init: true
  watchtower:
    <<: *restart-policy
    image: nickfedor/watchtower
    container_name: watchtower
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  james-weiland:
    <<: *restart-policy
    image: ghcr.io/jamesweiland/james-weiland:latest
    ports:
      - '127.0.0.1:4321:80'

networks:
  wg:
    ipam:
      config:
        - subnet: 10.8.1.0/24
    
      
volumes:
  webtunnel-tor-state:
  etc_wireguard:
